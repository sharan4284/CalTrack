<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CalTrack — Premium Fitness Platform</title>
  <meta name="description" content="Real-time calorie tracking, workout logging, AI coaching, and fitness analytics. Track meals, macros, workouts, and body progress with a premium dashboard.">
  <script>
    (function(){
      var isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
      var m = document.createElement('meta');
      m.name = 'theme-color';
      m.content = isDark ? '#070a08' : '#f4f8f5';
      document.head.appendChild(m);
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-mesh-grid" aria-hidden="true"></div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
